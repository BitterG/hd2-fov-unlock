# FOV Unlock —— 绝地潜兵2 垂直视野解锁配置
#
# 放到这里（或用记事本另存为）：
#   %APPDATA%\Arrowhead\Helldivers2\fov_unlock.cfg
#
# 改完保存，然后重启游戏。这个文件是可选的：没有它就用内置默认值（fov = 100）。
# 注释以 '#' 或 ';' 开头；键名不区分大小写。
#
# ---------------------------------------------------------------------------
# enabled              true|false    false = 完全停用（不写内存、不写设置文件）
# fov                  45..175       你要的垂直视野（Vertical Field of View）
# write_config_file    true|false    是否把 fov 写进 user_settings.config
# patch_code_clamp     true|false    ★危险开关，默认 false，见文件末尾
# ---------------------------------------------------------------------------

enabled = true

# 这就是 Options → Visuals → Vertical Field of View 那个滑条的值，
# 游戏本体只允许 45..90。写 100 左右就已经明显更宽了；
# 100~120 比较舒服，超过 140 画面会明显拉伸、边缘畸变很重。
# 注意：下限 45 不会被改。
fov = 100

# 写配置文件的作用：让引擎在任何一次"重新读取设置"时读到你的值。
# 会先备份成 user_settings.config.fov_unlock.bak（只备份一次，不会覆盖真原始值）。
write_config_file = true

# ===========================================================================
# ★ patch_code_clamp —— 默认 false，强烈建议保持 false
#
# true  = 额外去改 game.dll **可执行页**里那条把视野夹到 90 的指令。
#         改代码段是 nProtect GameGuard 最典型的特征；
#         **实测：会触发 GG，然后游戏直接关闭。**
#
# false = 只做纯数据写入（写活着的设置对象 + 写配置文件），
#         game.dll 的代码段一个字节都不碰。
#
# 默认就是 false。除非你明确知道自己在做什么、并且接受游戏被 GG 关掉，
# 否则不要打开它。
# ===========================================================================
patch_code_clamp = false

